<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<title>Spinning Plates</title>
		<!-- The emoji drawn as SVG inline, so there is no file for the server to
		     serve. The page grays it out when the server goes away. -->
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🍽️</text></svg>"
		/>
		<!-- What makes the page installable as an app. The manifest is fetched
		     without cookies unless asked, and through a tunnel, Cloudflare Access
		     would turn it away to sign in. The theme color follows the page's
		     theme once the app is running: see web/appearance.ts. -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<meta name="theme-color" content="#1d1f23" />
		<!-- The theme as web/appearance.ts sets it, its bare background until the
		     app mounts over it, so opening the app never paints white while the
		     styles and script are on their way. -->
		<script>
			// What the page kept as arbor, under splates's keys, once: kept for one
			// release after the rename.
			try {
				for (const store of [localStorage, sessionStorage]) {
					for (const key of Object.keys(store)) {
						const next = key.replace(/^arbor[.]/, "splates.");
						if (next !== key && store.getItem(next) === null) {
							store.setItem(next, store.getItem(key));
						}
					}
				}
			} catch {}
			try {
				const theme = JSON.parse(localStorage.getItem("splates.settings") ?? "{}")["appearance.theme"];
				const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
				document.querySelector('meta[name="theme-color"]').content = dark ? "#1d1f23" : "#f3f4f7";
			} catch {}
		</script>
		<!-- The page's first reads, started now rather than once its script has
		     loaded and mounted: the feeds take each for their first read. See
		     web/early-reads.ts. -->
		<script>
			try {
				const project = new URLSearchParams(location.search).get("project");
				const scoped = (path) => (project ? `${path}?${new URLSearchParams({ project })}` : path);
				window.splatesEarly = new Map(
					["/api/snapshot", "/api/conversations"].map((path) => [scoped(path), fetch(scoped(path))]),
				);
			} catch {}
		</script>
		<style>
			html { background: #f3f4f7; }
			html.dark { background: #1d1f23; }
		</style>
		<!-- Both are routes the server builds on request, not files next to this
		     one. See assets.ts in splates for why they are not Bun's HTML import. -->
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.js"></script>
	</body>
</html>
